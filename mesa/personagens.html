<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cofre de personagens — Ruínas de Adamar</title>
  <meta name="description" content="Os personagens de Adamar salvos neste navegador: veja a ficha pronta, edite, baixe ou mande para o narrador.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=409b6969">
  <script src="../js/whatsapp.js?v=07e0615b" defer></script>
  <script src="../js/site.js?v=8e7ff6b1" defer></script>
  <script src="../js/dados-gurps.js?v=f0eccd21" defer></script>
  <script src="../js/icones.js?v=bd7344e7" defer></script>
  <script src="../js/detalhes.js?v=8d72dcea" defer></script>
  <script src="../js/gurps-efeitos.js?v=0c7368a3" defer></script>
  <script src="../js/gurps-calculo.js?v=528cc8c1" defer></script>
  <script src="../js/criador-ficha.js?v=fdcb3944" defer></script>
  <script src="../js/personagens-salvos.js?v=4989026d" defer></script>
  <script src="../js/personagens.js?v=d48e2f31" defer></script>
</head>
<body data-root="../" data-page="mesa/personagens.html">
  <main id="conteudo" class="page page-wide page-cofre">
    <article class="scroll">
      <!-- lista -->
      <section id="modo-lista">
        <header class="page-head">
          <p class="kicker">À Mesa · GURPS</p>
          <h1>Cofre de personagens</h1>
          <p class="lede">Escolha um personagem para ver a ficha, ou crie um novo.</p>
        </header>
        <div class="cofre">
          <div class="cofre-grade" id="p-lista" aria-label="Personagens"></div>
          <div class="cofre-painel" id="p-painel" aria-live="polite"></div>
        </div>
        <div class="resumo-acoes cofre-rodape">
          <label class="btn-link criador-arquivo">Trazer ficha de outro aparelho (.json)…<input type="file" id="p-abrir" accept=".json,application/json"></label>
          <span class="copiado" id="p-aviso" role="status"></span>
        </div>
        <p class="field-hint">O cofre fica neste navegador. Para levar um personagem a outro aparelho, use Baixar e depois traga o arquivo lá.</p>
      </section>

    </article>

    <!-- ficha em tela cheia: barra no topo, seções à esquerda (gaveta no celular), conteúdo filtrado pela seção -->
    <section id="modo-ficha" class="fx" hidden>
      <header class="fx-topo">
        <a class="fx-voltar" href="personagens.html" aria-label="Voltar ao cofre">‹ <span>Cofre</span></a>
        <button type="button" class="fx-menu-btn" id="fx-menu-btn" aria-controls="fx-nav" aria-expanded="false" aria-label="Seções da ficha">☰</button>
        <div class="fx-quem">
          <h1 id="f-nome"></h1>
          <p class="fx-kicker" id="f-kicker"></p>
        </div>
        <div class="fx-pontos" id="fx-pontos" aria-live="polite"></div>
        <details class="fx-mais">
          <summary aria-label="Mais ações">⋯</summary>
          <div class="fx-mais-menu ficha-acoes">
            <a class="btn btn-primary" id="f-editar" href="#">Editar</a>
            <a class="btn btn-ghost" id="f-whats" href="#" target="_blank" rel="noopener">Enviar pelo WhatsApp</a>
            <button type="button" class="btn btn-ghost" id="f-baixar">Baixar (.json)</button>
            <button type="button" class="btn btn-ghost" id="f-imprimir">Imprimir</button>
          </div>
        </details>
      </header>
      <div class="fx-corpo">
        <nav class="fx-nav" id="fx-nav" aria-label="Seções da ficha"></nav>
        <div class="fx-veu" id="fx-veu" hidden></div>
        <div class="fx-conteudo ficha" id="f-ficha">
          <p class="lede" id="f-conceito"></p>
        </div>
      </div>
    </section>
  </main>
  <noscript><p class="noscript">Esta página precisa de JavaScript. Menu: <a href="../index.html">Início</a> · <a href="../mundo/visao-geral.html">O Mundo</a> · <a href="../canone/materialidade.html">Cânone</a> · <a href="../personagens/criando.html">Personagens</a> · <a href="../mesa/regras.html">À Mesa</a> · <a href="../cronicas/mito-da-criacao.html">Crônicas</a></p></noscript>
</body>
</html>
