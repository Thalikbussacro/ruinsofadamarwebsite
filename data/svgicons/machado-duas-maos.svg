<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 512" role="img">
  <title>Machado de duas mãos</title>
  <defs>
    <path id="lamina" d="M140 70 Q90 64 50 36 Q12 120 34 236 Q86 196 140 160 Z"/>
    <clipPath id="c-lamina"><use xlink:href="#lamina"/></clipPath>
  </defs>
  <g stroke="#0a0806" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- cabo longo -->
    <rect x="142" y="50" width="28" height="424" rx="10" fill="#7a5a3a"/>
    <path d="M149 170 V464" fill="none" stroke="#9a7448" stroke-width="6"/>
    <path d="M163 170 V464" fill="none" stroke="#55391f" stroke-width="4"/>
    <!-- empunhaduras -->
    <rect x="139" y="252" width="34" height="42" rx="7" fill="#6b2a24"/>
    <path d="M139 270 L173 260 M139 288 L173 278" fill="none" stroke-width="4"/>
    <rect x="139" y="384" width="34" height="82" rx="8" fill="#6b2a24"/>
    <path d="M146 392 V458" fill="none" stroke="#8a3a32" stroke-width="6"/>
    <path d="M139 404 L173 394 M139 428 L173 418 M139 452 L173 442" fill="none" stroke-width="4"/>
    <!-- lingüetas -->
    <rect x="138" y="160" width="36" height="60" rx="6" fill="#8a8579"/>
    <path d="M146 170 V210" fill="none" stroke="#b5ae9c" stroke-width="6"/>
    <!-- lâmina grande -->
    <use xlink:href="#lamina" fill="#8a8579"/>
    <g clip-path="url(#c-lamina)" stroke="none">
      <path d="M10 20 Q14 130 26 250 L50 236 Q34 130 60 20 Z" fill="#b5ae9c"/>
      <path d="M20 224 Q86 180 150 140 V190 L20 260 Z" fill="#5f5b52"/>
    </g>
    <use xlink:href="#lamina" fill="none"/>
    <path d="M64 56 Q46 136 58 214" fill="none" stroke="#5f5b52" stroke-width="4"/>
    <!-- espigão traseiro -->
    <path d="M168 90 L226 112 L168 132 Z" fill="#5f5b52"/>
    <path d="M168 90 L226 112 L168 108 Z" fill="#8a8579" stroke="none"/>
    <path d="M168 90 L226 112 L168 132 Z" fill="none"/>
    <!-- alvado -->
    <rect x="134" y="58" width="44" height="112" rx="8" fill="#8a8579"/>
    <path d="M144 70 V158" fill="none" stroke="#b5ae9c" stroke-width="7"/>
    <path d="M168 70 V158" fill="none" stroke="#5f5b52" stroke-width="6"/>
  </g>
</svg>
