<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 512" role="img">
  <title>Óleo</title>
  <!-- óleo (derivado): #c9a24e / #9e7a32 -->
  <defs>
    <path id="jarra" d="M96 190 H160 V214 Q222 244 222 340 Q222 440 176 460 Q128 470 80 460 Q34 440 34 340 Q34 244 96 214 Z"/>
    <clipPath id="c-jarra"><use xlink:href="#jarra"/></clipPath>
  </defs>
  <g transform="translate(128 256) scale(1.03) translate(-128 -293)" stroke="#0a0806" stroke-width="4.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- asa -->
    <path d="M156 206 Q214 180 214 240 Q214 270 196 286" fill="none" stroke-width="30"/>
    <path d="M156 206 Q214 180 214 240 Q214 270 196 286" fill="none" stroke="#8c5c40" stroke-width="18"/>
    <!-- corpo -->
    <use xlink:href="#jarra" fill="#8c5c40"/>
    <g clip-path="url(#c-jarra)" stroke="none">
      <path d="M20 180 H110 V220 Q70 260 74 340 Q78 420 98 470 H20 Z" fill="#b07a58"/>
      <path d="M240 180 H160 V230 Q196 270 190 350 Q184 430 148 470 H240 Z" fill="#64402c"/>
      <!-- vidrado escuro na metade de baixo -->
      <rect x="20" y="360" width="220" height="120" fill="#64402c"/>
      <rect x="20" y="360" width="56" height="120" fill="#8c5c40"/>
    </g>
    <use xlink:href="#jarra" fill="none"/>
    <path d="M36 360 Q128 374 220 360" fill="none" stroke-width="5"/>
    <!-- lábio e tampa de pano amarrada -->
    <path d="M84 170 Q80 128 128 122 Q176 128 172 170 Z" fill="#b5a98a"/>
    <path d="M90 162 Q90 134 120 128 Q104 146 104 166 Z" fill="#d8cdb0" stroke="none"/>
    <path d="M84 170 Q80 128 128 122 Q176 128 172 170 Z" fill="none"/>
    <rect x="82" y="166" width="92" height="30" rx="10" fill="#8c5c40"/>
    <path d="M92 176 H120" fill="none" stroke="#b07a58" stroke-width="5"/>
    <path d="M80 160 Q128 172 176 160" fill="none" stroke-width="14"/>
    <path d="M80 160 Q128 172 176 160" fill="none" stroke="#7c5a3a" stroke-width="6"/>
    <!-- escorrido de óleo -->
    <path d="M100 198 Q96 230 92 250 Q88 268 100 268 Q112 268 108 250 Q106 228 110 210 Z" fill="#c9a24e"/>
    <path d="M100 214 Q98 236 96 250" fill="none" stroke="#e6c878" stroke-width="4"/>
  </g>
</svg>
