<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 512" role="img">
  <title>Estaca de madeira</title>
  <defs>
    <path id="corpo" d="M104 200 L124 44 L156 190 L160 300 Q164 380 166 450 Q160 470 146 464 L134 470 L120 462 L104 470 Q92 462 94 448 Q96 380 98 300 Z"/>
    <clipPath id="c-corpo"><use xlink:href="#corpo"/></clipPath>
  </defs>
  <g transform="translate(-18 0)" stroke="#0a0806" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- toco de galho cortado -->
    <path d="M158 300 L188 276 Q196 272 198 280 L196 290 L162 322 Z" fill="#7a5a3a"/>
    <ellipse cx="193" cy="282" rx="6" ry="9" transform="rotate(42 193 282)" fill="#c4a070" stroke-width="4"/>
    <use xlink:href="#corpo" fill="#7a5a3a"/>
    <g clip-path="url(#c-corpo)" stroke="none">
      <!-- casca e luz do corpo -->
      <rect x="86" y="180" width="26" height="300" fill="#9a7448"/>
      <rect x="146" y="180" width="26" height="300" fill="#55391f"/>
      <!-- madeira crua talhada na ponta, cortes irregulares -->
      <path d="M86 30 H176 V196 L156 212 L138 182 L120 232 L100 206 L86 214 Z" fill="#a88456"/>
      <path d="M86 30 H124 L130 120 L120 232 L100 206 L86 214 Z" fill="#c4a070"/>
      <path d="M150 30 H176 V196 L156 212 L144 150 Z" fill="#86663e"/>
    </g>
    <use xlink:href="#corpo" fill="none"/>
    <path d="M98 208 L100 206 L120 232 L138 182 L156 212 L158 210" fill="none" stroke-width="4"/>
    <path d="M124 60 L130 120 L120 226 M130 120 L144 150 L152 200" fill="none" stroke="#86663e" stroke-width="3.5"/>
    <!-- veios da casca -->
    <path d="M118 270 Q116 330 120 400 M140 300 Q144 360 142 440" fill="none" stroke="#55391f" stroke-width="4"/>
  </g>
</svg>
