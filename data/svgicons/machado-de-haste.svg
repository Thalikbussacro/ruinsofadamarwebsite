<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img">
  <title>Machado de haste</title>
  <!-- Desenhado na vertical; rotate(45) leva a cabeça para o alto à direita
       e faz a luz local (vinda da esquerda) cair de cima à esquerda. -->
  <g transform="translate(245 300) scale(0.88) rotate(45)" stroke="#0a0806" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <defs><clipPath id="c-lamina"><path d="M-16 -270 Q-50 -284 -84 -326 Q-134 -236 -98 -132 Q-62 -184 -16 -200 Z"/></clipPath></defs>
    <rect x="-13.0" y="-284" width="26" height="534" rx="10" fill="#7a5a3a"/>
    <path d="M-6.0 -272 V238" fill="none" stroke="#9a7448" stroke-width="6"/>
    <path d="M7.0 -272 V238" fill="none" stroke="#55391f" stroke-width="4"/>
    <rect x="-16.0" y="30" width="32" height="66" rx="8" fill="#6b2a24"/>
    <path d="M-9.0 38 V88" fill="none" stroke="#8a3a32" stroke-width="6"/>
    <path d="M-16.0 48 L16.0 38 M-16.0 72 L16.0 62" fill="none" stroke-width="4"/>
    <rect x="-16.0" y="170" width="32" height="66" rx="8" fill="#6b2a24"/>
    <path d="M-9.0 178 V228" fill="none" stroke="#8a3a32" stroke-width="6"/>
    <path d="M-16.0 188 L16.0 178 M-16.0 212 L16.0 202" fill="none" stroke-width="4"/>
    <path d="M-15.0 242 H15.0 L10.0 262 Q0 268 -10.0 262 Z" fill="#8a8579"/>
    <path d="M-7.0 250 L-5.0 256" fill="none" stroke="#b5ae9c" stroke-width="5"/>
    <!-- lâmina grande em meia-lua -->
    <path d="M-16 -270 Q-50 -284 -84 -326 Q-134 -236 -98 -132 Q-62 -184 -16 -200 Z" fill="#8a8579"/>
    <g clip-path="url(#c-lamina)" stroke="none">
      <path d="M-140 -340 L-84 -340 Q-118 -236 -84 -120 L-140 -120 Z" fill="#b5ae9c"/>
      <path d="M-140 -170 Q-70 -196 -10 -214 V-150 H-140 Z" fill="#5f5b52"/>
    </g>
    <path d="M-16 -270 Q-50 -284 -84 -326 Q-134 -236 -98 -132 Q-62 -184 -16 -200 Z" fill="none"/>
    <path d="M-72 -300 Q-104 -236 -82 -164" fill="none" stroke="#5f5b52" stroke-width="4"/>
    <!-- talão -->
    <rect x="10" y="-262" width="26" height="46" rx="6" fill="#5f5b52"/>
    <!-- alvado e lingüetas -->
    <rect x="-18" y="-290" width="36" height="100" rx="8" fill="#8a8579"/>
    <path d="M-9 -280 V-200" fill="none" stroke="#b5ae9c" stroke-width="6"/>
    <path d="M10 -280 V-200" fill="none" stroke="#5f5b52" stroke-width="5"/>
    <rect x="-16" y="-192" width="32" height="70" rx="6" fill="#8a8579"/>
    <path d="M-8 -182 V-132" fill="none" stroke="#b5ae9c" stroke-width="5"/>
  </g>
</svg>
