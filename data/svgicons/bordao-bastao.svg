    <path d="M-19 262 H19 V312 Q0 322 -19 312 Z" fill="#8a8579"/>
    <path d="M-10 270 V306" fill="none" stroke="#b5ae9c" stroke-width="6"/>
    <path d="M-19 276 H19" fill="none" stroke-width="4"/>
