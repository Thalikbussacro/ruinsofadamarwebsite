<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img">
  <title>Glaive</title>
  <!-- Desenhado na vertical; rotate(45) leva a cabeça para o alto à direita
       e faz a luz local (vinda da esquerda) cair de cima à esquerda. -->
  <g transform="translate(252 252) scale(0.93) rotate(45)" stroke="#0a0806" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <defs><clipPath id="c-lamina"><path d="M-16 -108 V-250 Q-12 -296 14 -318 Q56 -256 52 -186 Q48 -132 16 -108 Z"/></clipPath></defs>
    <rect x="-13.0" y="-110" width="26" height="406" rx="10" fill="#7a5a3a"/>
    <path d="M-6.0 -98 V284" fill="none" stroke="#9a7448" stroke-width="6"/>
    <path d="M7.0 -98 V284" fill="none" stroke="#55391f" stroke-width="4"/>
    <rect x="-16.0" y="150" width="32" height="90" rx="8" fill="#6b2a24"/>
    <path d="M-9.0 158 V232" fill="none" stroke="#8a3a32" stroke-width="6"/>
    <path d="M-16.0 168 L16.0 158 M-16.0 192 L16.0 182 M-16.0 216 L16.0 206" fill="none" stroke-width="4"/>
    <path d="M-15.0 286 H15.0 L10.0 306 Q0 312 -10.0 306 Z" fill="#8a8579"/>
    <path d="M-7.0 294 L-5.0 300" fill="none" stroke="#b5ae9c" stroke-width="5"/>
    <!-- esporão traseiro -->
    <path d="M-14 -200 Q-36 -206 -54 -232 Q-50 -196 -14 -166 Z" fill="#8a8579"/>
    <path d="M-16 -198 Q-36 -206 -50 -224 Q-44 -204 -24 -192 Z" fill="#b5ae9c" stroke="none"/>
    <path d="M-14 -200 Q-36 -206 -54 -232 Q-50 -196 -14 -166 Z" fill="none"/>
    <!-- lâmina larga de um gume -->
    <path d="M-16 -108 V-250 Q-12 -296 14 -318 Q56 -256 52 -186 Q48 -132 16 -108 Z" fill="#8a8579"/>
    <g clip-path="url(#c-lamina)" stroke="none">
      <rect x="-20" y="-330" width="22" height="230" fill="#b5ae9c"/>
      <path d="M14 -318 Q56 -256 52 -186 Q48 -132 16 -108 L4 -122 Q36 -140 38 -188 Q40 -250 6 -306 Z" fill="#5f5b52" transform="translate(0 0)"/>
    </g>
    <path d="M-16 -108 V-250 Q-12 -296 14 -318 Q56 -256 52 -186 Q48 -132 16 -108 Z" fill="none"/>
    <path d="M0 -270 Q4 -200 2 -124" fill="none" stroke="#5f5b52" stroke-width="4"/>
    <!-- alvado -->
    <rect x="-19" y="-116" width="38" height="70" rx="7" fill="#8a8579"/>
    <path d="M-10 -106 V-56" fill="none" stroke="#b5ae9c" stroke-width="6"/>
    <path d="M-19 -100 H19" fill="none" stroke-width="4"/>
  </g>
</svg>
