<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 512" role="img">
  <title>Barraca, 1 pessoa</title>
  <defs>
    <path id="rolo" d="M58 96 Q58 72 128 72 Q198 72 198 96 V420 Q198 444 128 444 Q58 444 58 420 Z"/>
    <clipPath id="c-rolo"><use xlink:href="#rolo"/></clipPath>
  </defs>
  <g stroke="#0a0806" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- estacas de madeira atrás do rolo -->
    <path d="M86 52 V456" fill="none" stroke-width="22"/>
    <path d="M86 52 V456" fill="none" stroke="#7a5a3a" stroke-width="12"/>
    <path d="M170 52 V456" fill="none" stroke-width="22"/>
    <path d="M170 52 V456" fill="none" stroke="#7a5a3a" stroke-width="12"/>
    <path d="M78 452 L86 472 L94 452 Z M162 452 L170 472 L178 452 Z" fill="#9a7448"/>
    <!-- lona enrolada -->
    <use xlink:href="#rolo" fill="#b5a98a"/>
    <g clip-path="url(#c-rolo)" stroke="none">
      <rect x="50" y="60" width="40" height="400" fill="#d8cdb0"/>
      <rect x="166" y="60" width="40" height="400" fill="#8f8468"/>
    </g>
    <use xlink:href="#rolo" fill="none"/>
    <!-- borda da lona enrolada -->
    <path d="M100 100 Q112 260 104 430" fill="none" stroke="#8f8468" stroke-width="4"/>
    <!-- topo do rolo: espiral -->
    <ellipse cx="128" cy="96" rx="70" ry="24" fill="#d8cdb0"/>
    <path d="M128 96 m-10 0 a10 5 0 1 1 20 0 a24 11 0 1 1 -44 0 a38 16 0 1 1 72 0 a52 20 0 1 1 -96 4" fill="none" stroke="#8f8468" stroke-width="4"/>
    <!-- amarras de corda -->
    <path d="M56 176 Q128 194 200 176" fill="none" stroke-width="20"/>
    <path d="M56 176 Q128 194 200 176" fill="none" stroke="#7c5a3a" stroke-width="10"/>
    <path d="M56 352 Q128 370 200 352" fill="none" stroke-width="20"/>
    <path d="M56 352 Q128 370 200 352" fill="none" stroke="#7c5a3a" stroke-width="10"/>
    <!-- corda de esticar presa ao rolo -->
    <path d="M196 200 Q226 260 200 330" fill="none" stroke-width="14"/>
    <path d="M196 200 Q226 260 200 330" fill="none" stroke="#d8cdb0" stroke-width="6"/>
  </g>
</svg>
