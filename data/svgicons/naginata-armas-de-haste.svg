<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img">
  <title>Naginata</title>
  <!-- Desenhado na vertical; rotate(45) leva a cabeça para o alto à direita
       e faz a luz local (vinda da esquerda) cair de cima à esquerda. -->
  <g transform="translate(264 266) scale(0.93) rotate(45)" stroke="#0a0806" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <defs><clipPath id="c-lamina"><path d="M-16 -126 C-14 -206 -18 -262 -34 -312 C24 -280 44 -228 22 -126 Z"/></clipPath></defs>
    <rect x="-13.0" y="-110" width="26" height="406" rx="10" fill="#5a3f26"/>
    <path d="M-6.0 -98 V284" fill="none" stroke="#7a5a3a" stroke-width="6"/>
    <path d="M7.0 -98 V284" fill="none" stroke="#3e2915" stroke-width="4"/>
    <rect x="-16" y="236" width="32" height="64" rx="7" fill="#8a8579"/>
    <path d="M-8 246 V290" fill="none" stroke="#b5ae9c" stroke-width="6"/>
    <!-- lâmina curva -->
    <path d="M-16 -126 C-14 -206 -18 -262 -34 -312 C24 -280 44 -228 22 -126 Z" fill="#8a8579"/>
    <g clip-path="url(#c-lamina)" stroke="none">
      <path d="M-24 -126 C-22 -206 -26 -262 -42 -320 L-24 -320 C-8 -262 -2 -206 -2 -126 Z" fill="#b5ae9c"/>
      <path d="M-34 -312 C24 -280 44 -228 22 -126 L10 -126 C30 -228 14 -270 -34 -306 Z" fill="#5f5b52"/>
    </g>
    <path d="M-16 -126 C-14 -206 -18 -262 -34 -312 C24 -280 44 -228 22 -126 Z" fill="none"/>
    <path d="M0 -140 C2 -210 -4 -258 -24 -296" fill="none" stroke="#5f5b52" stroke-width="4"/>
    <!-- colar metálico -->
    <rect x="-17" y="-110" width="34" height="58" rx="6" fill="#8a8579"/>
    <path d="M-9 -100 V-62" fill="none" stroke="#b5ae9c" stroke-width="6"/>
    <!-- tsuba -->
    <rect x="-38" y="-130" width="76" height="20" rx="9" fill="#5f5b52"/>
    <path d="M-28 -124 H-4" fill="none" stroke="#8a8579" stroke-width="5"/>
  </g>
</svg>
