    <rect x="300" y="66" width="36" height="340" rx="6" fill="#573d26"/>
    <path d="M308 80 V392" fill="none" stroke="#7c5a3a" stroke-width="6"/>
    <rect x="290" y="320" width="56" height="44" rx="6" fill="none" stroke-width="18"/>
    <rect x="290" y="320" width="56" height="44" rx="6" fill="none" stroke="#8a8579" stroke-width="8"/>
