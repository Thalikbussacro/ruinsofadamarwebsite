<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" role="img">
  <title>Mochila</title>
  <defs>
    <path id="corpo" d="M124 190 Q124 160 154 160 H358 Q388 160 388 190 V436 Q388 464 358 464 H154 Q124 464 124 436 Z"/>
