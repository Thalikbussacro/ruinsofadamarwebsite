      <rect x="108" y="136" width="40" height="200" fill="#a07850"/>
      <rect x="362" y="136" width="40" height="200" fill="#573d26"/>
    </g>
    <use xlink:href="#aba" fill="none"/>
    <path d="M138 304 Q256 316 374 304" fill="none" stroke="#573d26" stroke-width="5" stroke-dasharray="10 11"/>
    <!-- correias com fivelas (prendem o cobertor) -->
    <g id="correia">
      <rect x="176" y="66" width="36" height="340" rx="6" fill="#573d26"/>
      <path d="M184 80 V392" fill="none" stroke="#7c5a3a" stroke-width="6"/>
      <rect x="166" y="320" width="56" height="44" rx="6" fill="none" stroke-width="18"/>
