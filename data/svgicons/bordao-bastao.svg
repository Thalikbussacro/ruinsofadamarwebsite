    <path d="M11.0 -280 V280" fill="none" stroke="#55391f" stroke-width="4"/>
    <!-- ponteiras de ferro -->
    <path d="M-19 -312 Q0 -322 19 -312 V-262 H-19 Z" fill="#8a8579"/>
    <path d="M-10 -306 V-270" fill="none" stroke="#b5ae9c" stroke-width="6"/>
