    <path id="aba" d="M116 176 Q116 146 154 144 H358 Q396 146 396 176 V286 Q396 318 358 322 H154 Q116 318 116 286 Z"/>
    <clipPath id="c-aba"><use xlink:href="#aba"/></clipPath>
  </defs>
  <g stroke="#0a0806" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- bolsos laterais -->
    <rect x="66" y="270" width="80" height="170" rx="22" fill="#7c5a3a"/>
    <path d="M78 290 V420" fill="none" stroke="#a07850" stroke-width="8"/>
    <path d="M66 310 Q106 322 146 310" fill="none" stroke-width="5"/>
    <rect x="366" y="270" width="80" height="170" rx="22" fill="#573d26"/>
    <path d="M366 310 Q406 322 446 310" fill="none" stroke-width="5"/>
    <!-- corpo -->
    <use xlink:href="#corpo" fill="#7c5a3a"/>
    <g clip-path="url(#c-corpo)" stroke="none">
      <rect x="114" y="150" width="44" height="330" fill="#a07850"/>
      <rect x="352" y="150" width="44" height="330" fill="#573d26"/>
      <rect x="114" y="432" width="290" height="40" fill="#573d26"/>
    </g>
    <use xlink:href="#corpo" fill="none"/>
    <!-- cobertor enrolado por cima -->
    <rect x="96" y="74" width="320" height="84" rx="40" fill="#85493a"/>
    <path d="M132 90 H380" fill="none" stroke="#a8634a" stroke-width="10"/>
    <path d="M132 146 H380" fill="none" stroke="#5e3329" stroke-width="8"/>
    <!-- aba -->
    <use xlink:href="#aba" fill="#7c5a3a"/>
    <g clip-path="url(#c-aba)" stroke="none">
