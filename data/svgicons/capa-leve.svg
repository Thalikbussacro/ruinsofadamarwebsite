<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" role="img">
  <title>Capa leve</title>
  <defs>
    <path id="corpo" d="M212 118 Q170 220 104 444 Q140 468 180 452 Q218 474 256 458 Q294 474 332 452 Q372 468 408 444 Q342 220 300 118 Z"/>
    <clipPath id="c-corpo"><use xlink:href="#corpo"/></clipPath>
  </defs>
  <g stroke="#0a0806" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- capuz caído nas costas -->
    <path d="M186 134 Q180 72 256 38 Q332 72 326 134 Z" fill="#b5a98a"/>
    <path d="M198 124 Q196 80 246 50" fill="none" stroke="#d8cdb0" stroke-width="8"/>
    <path d="M214 134 Q216 96 256 74 Q296 96 298 134 Z" fill="#6e6552"/>
